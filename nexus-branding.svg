    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>
  <circle cx="240" cy="200" r="120" fill="#8B5CF6" opacity="0.2" filter="blur(40px)"/>
  <circle cx="560" cy="280" r="130" fill="#06B6D4" opacity="0.18" filter="blur(45px)"/>
  
  <rect x="100" y="60" width="600" height="380" rx="24" fill="rgba(20, 27, 45, 0.75)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <circle cx="220" cy="180" r="54" fill="url(#gradNexus)" filter="url(#glow1)"/>
  <path d="M195 180 L212 155 L228 180 L245 155 L245 205 L228 205 L228 180 L212 205 L195 180 Z" fill="#ffffff" opacity="0.95"/>
  
  <text x="300" y="170" font-family="'Inter', system-ui, sans-serif" font-size="32" font-weight="800" fill="#ffffff" letter-spacing="1">NEXUS</text>
  <text x="300" y="200" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" fill="#818CF8" letter-spacing="4">MARKETING LABS</text>
  <text x="300" y="230" font-family="'Inter', system-ui, sans-serif" font-size="14" fill="#94A3B8">Brand Identity • Strategic Positioning • Digital Ecosystem</text>

  <g transform="translate(140, 290)">
    <rect x="0" y="0" width="90" height="90" rx="16" fill="#0F172A" stroke="rgba(255,255,255,0.1)"/>
    <text x="45" y="50" text-anchor="middle" fill="#64748B" font-size="11" font-family="sans-serif">#0F172A</text>
    
    <rect x="110" y="0" width="90" height="90" rx="16" fill="#8B5CF6"/>
