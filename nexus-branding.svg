    <rect x="220" y="0" width="90" height="90" rx="16" fill="#3B82F6"/>
    <text x="265" y="50" text-anchor="middle" fill="#ffffff" font-size="11" font-family="sans-serif">#3B82F6</text>
    
    <rect x="330" y="0" width="90" height="90" rx="16" fill="#06B6D4"/>
    <text x="375" y="50" text-anchor="middle" fill="#042f2e" font-size="11" font-weight="bold" font-family="sans-serif">#06B6D4</text>
    
